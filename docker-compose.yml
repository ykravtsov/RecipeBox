version: "3.8"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: recipebox
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  rust-backend:
    build:
      context: ./rust-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:password@postgres/recipebox
      JWT_SECRET: ${JWT_SECRET}
      XAI_API_KEY: ${XAI_API_KEY}
    ports:
      - "3000:3000"

    command: ["./rust-backend"]

  frontend:
    build:
      context: ./frontend
      target: development
    depends_on:
      - rust-backend
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - VITE_API_BASE_URL=http://localhost:3000

volumes:
  postgres_data:
