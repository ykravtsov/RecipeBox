<mat-card class="meal-card">
  <mat-card-header>
    <mat-card-title>Current Meal</mat-card-title>
    <mat-card-subtitle *ngIf="meal.recipes.length > 0">
      {{ meal.recipes.length }} recipes • Prep: {{ meal.totalPrepTime }}min •
      Cook: {{ meal.totalCookTime }}min
    </mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <div *ngIf="meal.recipes.length === 0" class="empty-meal">
      <p>No recipes added to meal yet.</p>
    </div>

    <div *ngIf="meal.recipes.length > 0">
      <h3>Recipes:</h3>
      <mat-list>
        <mat-list-item *ngFor="let recipe of meal.recipes">
          <span>{{ recipe.title }}</span>
          <button mat-icon-button (click)="removeRecipe(recipe.id)">
            <mat-icon>delete</mat-icon>
          </button>
        </mat-list-item>
      </mat-list>

      <h3>Master Shopping List:</h3>
      <ul>
        <li *ngFor="let ingredient of meal.aggregatedIngredients">
          {{ ingredient.quantity }} {{ ingredient.unit }} {{ ingredient.name }}
        </li>
      </ul>

      <div class="meal-actions">
        <button mat-raised-button color="primary" (click)="scheduleMeal()">
          Schedule Meal
        </button>
        <button mat-button (click)="clearMeal()">Clear Meal</button>
      </div>
    </div>
  </mat-card-content>
</mat-card>
