<mat-card class="container">
  <mat-card-header>
    <mat-card-title>Add New Recipe</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <div class="import-section">
      <button
        mat-raised-button
        color="accent"
        (click)="openImportDialog()"
        class="mb-3"
      >
        Import from Website
      </button>
    </div>

    <form (ngSubmit)="addRecipe()">
      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Title</mat-label>
        <input matInput [(ngModel)]="recipe.title" name="title" required />
      </mat-form-field>

      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Description</mat-label>
        <textarea
          matInput
          [(ngModel)]="recipe.description"
          name="description"
        ></textarea>
      </mat-form-field>

      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Image URL</mat-label>
        <input
          matInput
          [(ngModel)]="recipe.imageUrl"
          name="imageUrl"
          placeholder="https://example.com/image.jpg"
        />
      </mat-form-field>

      <div class="ingredients-section">
        <h3>Ingredients</h3>
        <div
          *ngFor="let ingredient of recipe.ingredients; let i = index"
          class="ingredient-row"
        >
          <mat-form-field appearance="fill">
            <mat-label>Quantity</mat-label>
            <input
              matInput
              type="number"
              step="0.01"
              [(ngModel)]="ingredient.quantity"
              [name]="'quantity-' + i"
            />
          </mat-form-field>
          <mat-form-field appearance="fill">
            <mat-label>Unit</mat-label>
            <input
              matInput
              [(ngModel)]="ingredient.unit"
              [name]="'unit-' + i"
              placeholder="cups, tbsp, etc."
            />
          </mat-form-field>
          <mat-form-field appearance="fill" class="ingredient-name">
            <mat-label>Ingredient</mat-label>
            <input
              matInput
              [(ngModel)]="ingredient.name"
              [name]="'name-' + i"
              required
            />
          </mat-form-field>
          <button
            mat-icon-button
            color="warn"
            type="button"
            (click)="removeIngredient(i)"
          >
            <mat-icon>delete</mat-icon>
          </button>
        </div>
        <button mat-stroked-button type="button" (click)="addIngredient()">
          <mat-icon>add</mat-icon>
          Add Ingredient
        </button>
      </div>

      <div class="steps-section">
        <h3>Instructions</h3>
        <div *ngFor="let step of recipe.steps; let i = index" class="step-row">
          <mat-form-field appearance="fill" class="step-input">
            <mat-label>Step {{ i + 1 }}</mat-label>
            <textarea
              matInput
              [(ngModel)]="recipe.steps[i]"
              [name]="'step-' + i"
              rows="2"
            ></textarea>
          </mat-form-field>
          <button
            mat-icon-button
            color="warn"
            type="button"
            (click)="removeStep(i)"
          >
            <mat-icon>delete</mat-icon>
          </button>
        </div>
        <button mat-stroked-button type="button" (click)="addStep()">
          <mat-icon>add</mat-icon>
          Add Step
        </button>
      </div>

      <div class="button-group">
        <button mat-raised-button color="primary" type="submit">
          Add Recipe
        </button>
        <button mat-button color="accent" routerLink="/">Cancel</button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
