<mat-card class="container">
  <mat-card-header>
    <mat-card-title>Add New Recipe</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <div class="import-section">
      <button
        mat-raised-button
        color="accent"
        (click)="openImportDialog()"
        class="mb-3"
      >
        Import from Website
      </button>
    </div>

    <form [formGroup]="recipeForm" (ngSubmit)="addRecipe()">
      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Title</mat-label>
        <input matInput formControlName="title" />
        <mat-error
          *ngIf="
            recipeForm.get('title')?.invalid && recipeForm.get('title')?.touched
          "
        >
          {{ getErrorMessage("title") }}
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Description</mat-label>
        <textarea matInput formControlName="description"></textarea>
        <mat-error
          *ngIf="
            recipeForm.get('description')?.invalid &&
            recipeForm.get('description')?.touched
          "
        >
          {{ getErrorMessage("description") }}
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Image URL</mat-label>
        <input
          matInput
          formControlName="imageUrl"
          placeholder="https://example.com/image.jpg"
        />
      </mat-form-field>

      <div class="ingredients-section" formArrayName="ingredients">
        <h3>Ingredients</h3>
        <div
          *ngFor="let ingredient of ingredients.controls; let i = index"
          class="ingredient-row"
          [formGroupName]="i"
        >
          <mat-form-field appearance="fill">
            <mat-label>Quantity</mat-label>
            <input
              matInput
              type="number"
              step="0.01"
              formControlName="quantity"
            />
          </mat-form-field>
          <mat-form-field appearance="fill">
            <mat-label>Unit</mat-label>
            <input
              matInput
              formControlName="unit"
              placeholder="cups, tbsp, etc."
            />
          </mat-form-field>
          <mat-form-field appearance="fill" class="ingredient-name">
            <mat-label>Ingredient</mat-label>
            <input matInput formControlName="name" />
            <mat-error
              *ngIf="
                ingredients.at(i).get('name')?.invalid &&
                ingredients.at(i).get('name')?.touched
              "
            >
              Ingredient name is required
            </mat-error>
          </mat-form-field>
          <button
            mat-icon-button
            color="warn"
            type="button"
            (click)="removeIngredient(i)"
          >
            <mat-icon>delete</mat-icon>
          </button>
        </div>
        <mat-error
          *ngIf="
            recipeForm.get('ingredients')?.invalid &&
            recipeForm.get('ingredients')?.touched
          "
        >
          {{ getIngredientsErrorMessage() }}
        </mat-error>
        <button mat-stroked-button type="button" (click)="addIngredient()">
          <mat-icon>add</mat-icon>
          Add Ingredient
        </button>
      </div>

      <div class="steps-section" formArrayName="steps">
        <h3>Instructions</h3>
        <div
          *ngFor="let step of steps.controls; let i = index"
          class="step-row"
        >
          <mat-form-field appearance="fill" class="step-input">
            <mat-label>Step {{ i + 1 }}</mat-label>
            <textarea matInput formControlName="{{ i }}" rows="2"></textarea>
            <mat-error *ngIf="steps.at(i)?.invalid && steps.at(i)?.touched">
              Step content is required
            </mat-error>
          </mat-form-field>
          <button
            mat-icon-button
            color="warn"
            type="button"
            (click)="removeStep(i)"
          >
            <mat-icon>delete</mat-icon>
          </button>
        </div>
        <mat-error
          *ngIf="
            recipeForm.get('steps')?.invalid && recipeForm.get('steps')?.touched
          "
        >
          {{ getStepsErrorMessage() }}
        </mat-error>
        <button mat-stroked-button type="button" (click)="addStep()">
          <mat-icon>add</mat-icon>
          Add Step
        </button>
      </div>

      <div class="button-group">
        <button mat-raised-button color="primary" type="submit">
          Add Recipe
        </button>
        <button mat-button color="accent" routerLink="/">Cancel</button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
