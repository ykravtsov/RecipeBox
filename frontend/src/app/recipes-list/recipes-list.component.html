<mat-card>
  <mat-card-header>
    <mat-card-title>Recipes</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <div class="actions-row">
      <button
        mat-raised-button
        color="primary"
        routerLink="/recipes/add"
        class="mb-3"
      >
        Add New Recipe
      </button>
    </div>

    <div class="search-section">
      <mat-form-field appearance="outline" class="search-input">
        <mat-label>Search by tags or ingredients</mat-label>
        <input
          matInput
          [(ngModel)]="searchQuery"
          (keyup.enter)="addSearchTerm()"
          placeholder="Type and press Enter to add"
        />
      </mat-form-field>
      <button
        mat-raised-button
        color="accent"
        (click)="addSearchTerm()"
        class="add-term-btn"
      >
        Add
      </button>
      <button mat-raised-button (click)="searchRecipes()" class="search-btn">
        Search
      </button>
      <button mat-button (click)="clearSearch()" class="clear-btn">
        Clear
      </button>
    </div>

    <div class="search-chips" *ngIf="searchTerms.length > 0">
      <mat-chip-listbox>
        <mat-chip
          *ngFor="let term of searchTerms"
          (removed)="removeSearchTerm(term)"
        >
          {{ term }}
          <button matChipRemove>
            <mat-icon>cancel</mat-icon>
          </button>
        </mat-chip>
      </mat-chip-listbox>
    </div>

    <div class="main-content">
      <div class="recipes-section">
        <div class="recipes-grid">
          <mat-card *ngFor="let recipe of recipes" class="recipe-card">
            <img
              mat-card-image
              [src]="
                recipe.imageUrl ||
                'https://via.placeholder.com/300x200?text=No+Image'
              "
              [alt]="recipe.title"
            />
            <mat-card-header>
              <mat-card-title>{{ recipe.title }}</mat-card-title>
              <mat-card-subtitle>{{ recipe.description }}</mat-card-subtitle>
            </mat-card-header>
            <mat-card-actions>
              <button
                mat-button
                color="accent"
                routerLink="/recipe/{{ recipe.id }}"
              >
                View Details
              </button>
              <button
                mat-button
                color="primary"
                routerLink="/recipe/{{ recipe.id }}/edit"
              >
                Edit
              </button>
              <button mat-button color="warn" (click)="addToMeal(recipe)">
                Add to Meal
              </button>
            </mat-card-actions>
          </mat-card>
        </div>
      </div>
    </div>
  </mat-card-content>
</mat-card>
