<mat-card>
  <mat-card-header>
    <mat-card-title>Recipes</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <div class="actions-row">
      <button
        mat-raised-button
        color="primary"
        routerLink="/recipes/add"
        class="mb-3"
      >
        Add New Recipe
      </button>
    </div>

    <div class="recipes-grid">
      <mat-card *ngFor="let recipe of recipes" class="recipe-card">
        <img
          mat-card-image
          [src]="
            recipe.imageUrl ||
            'https://via.placeholder.com/300x200?text=No+Image'
          "
          [alt]="recipe.title"
        />
        <mat-card-header>
          <mat-card-title>{{ recipe.title }}</mat-card-title>
          <mat-card-subtitle>{{ recipe.description }}</mat-card-subtitle>
        </mat-card-header>
        <mat-card-actions>
          <button
            mat-button
            color="accent"
            routerLink="/recipe/{{ recipe.id }}"
          >
            View Details
          </button>
          <button
            mat-button
            color="primary"
            routerLink="/recipe/{{ recipe.id }}/edit"
          >
            Edit
          </button>
        </mat-card-actions>
      </mat-card>
    </div>
  </mat-card-content>
</mat-card>
