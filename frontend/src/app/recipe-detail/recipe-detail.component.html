<mat-card class="container">
  <mat-card-header>
    <mat-card-title *ngIf="!isEditMode">Recipe Details</mat-card-title>
    <mat-card-title *ngIf="isEditMode">Edit Recipe</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <div *ngIf="!isEditMode">
      <div *ngIf="recipe.imageUrl" class="recipe-image">
        <img [src]="recipe.imageUrl" [alt]="recipe.title" />
      </div>
      <p><strong>Title:</strong> {{ recipe.title }}</p>
      <p><strong>Description:</strong> {{ recipe.description }}</p>

      <div
        *ngIf="recipe.ingredients && recipe.ingredients.length > 0"
        class="ingredients-section"
      >
        <h3>Ingredients</h3>
        <ul>
          <li *ngFor="let ingredient of recipe.ingredients">
            {{ ingredient.quantity }} {{ ingredient.unit }}
            {{ ingredient.name }}
          </li>
        </ul>
      </div>

      <div
        *ngIf="recipe.steps && recipe.steps.length > 0"
        class="steps-section"
      >
        <h3>Instructions</h3>
        <ol>
          <li *ngFor="let step of recipe.steps">{{ step }}</li>
        </ol>
      </div>

      <div class="button-group">
        <button
          mat-raised-button
          color="accent"
          routerLink="/recipe/{{ recipe.id }}/edit"
        >
          Edit
        </button>
        <button mat-raised-button color="warn" (click)="deleteRecipe()">
          Delete
        </button>
        <button mat-button color="primary" routerLink="/">Back to List</button>
      </div>
    </div>

    <form *ngIf="isEditMode" (ngSubmit)="saveRecipe()">
      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Title</mat-label>
        <input matInput [(ngModel)]="recipe.title" name="title" required />
      </mat-form-field>

      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Description</mat-label>
        <textarea
          matInput
          [(ngModel)]="recipe.description"
          name="description"
        ></textarea>
      </mat-form-field>

      <div class="button-group">
        <button mat-raised-button color="primary" type="submit">Save</button>
        <button mat-button color="accent" routerLink="/recipe/{{ recipe.id }}">
          Cancel
        </button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
