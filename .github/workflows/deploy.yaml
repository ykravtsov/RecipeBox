name: Deploy to AKS

on:
  push:
    branches:
      - main
    paths:
      - "api/**"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Run tests
        run: |
          cd api
          dotnet test --verbosity normal

      - name: Build and push Docker image
        run: |
          az acr login --name recipeboxacr
          cd api
          docker build -t recipeboxacr.azurecr.io/recipebox-api:${{ github.sha }} .
          docker push recipeboxacr.azurecr.io/recipebox-api:${{ github.sha }}

      - name: Update Helm values
        run: |
          sed -i "s/tag: .*/tag: \"${{ github.sha }}\"/" k8s/values.yaml

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add k8s/values.yaml
          git commit -m "Update image tag to ${{ github.sha }}" || echo "No changes to commit"
          git push
