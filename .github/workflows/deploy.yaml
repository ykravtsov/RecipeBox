name: Deploy to AKS

on:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  build-infra:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Check for infra changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            infra:
              - 'infra/**'
              - '.github/**'

      - name: Debug env
        if: steps.filter.outputs.infra == 'true'
        env:
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          echo "ARM_SUBSCRIPTION_ID: $ARM_SUBSCRIPTION_ID"
          echo "ARM_CLIENT_ID: $ARM_CLIENT_ID"
          echo "ARM_TENANT_ID: $ARM_TENANT_ID"

      # 1. Install Terraform CLI (CRITICAL FIX)
      - name: Setup Terraform
        if: steps.filter.outputs.infra == 'true'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0" # Match this to the version required by your stack
          terraform_wrapper: false # Recommended for CDKTF to avoid output parsing issues

      # 2. Setup Node.js
      - name: Setup Node
        if: steps.filter.outputs.infra == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Install Dependencies (Fixes npm issues)
      - name: Install Dependencies
        if: steps.filter.outputs.infra == 'true'
        run: |
          cd infra
          npm ci

      # 4. Generate CDKTF Constructs (If needed)
      - name: Generate CDKTF
        if: steps.filter.outputs.infra == 'true'
        run: |
          cd infra
          npx cdktf-cli get

      # 5. Synthesize Infrastructure
      - name: Synthesize
        if: steps.filter.outputs.infra == 'true'
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          cd infra
          npx cdktf-cli synth
      - name: Upload infrastructure artifact
        if: steps.filter.outputs.infra == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cdktf-out
          path: infra/cdktf.out/
      - name: Download previous artifact
        if: steps.filter.outputs.infra != 'true'
        uses: dawidd6/action-download-artifact@v2
        with:
          workflow: deploy.yaml
          name: cdktf-out
          path: infra/cdktf.out/
          branch: main
          workflow_conclusion: success
  test-infra:
    needs: build-infra
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Download infrastructure artifact
        uses: actions/download-artifact@v4
        with:
          name: cdktf-out
          path: infra/cdktf.out/
      - name: Install Conftest
        run: |
          wget -O conftest.tar.gz https://github.com/open-policy-agent/conftest/releases/download/v0.48.0/conftest_0.48.0_Linux_x86_64.tar.gz
          tar -xzf conftest.tar.gz
          sudo mv conftest /usr/local/bin/
      - name: Run infrastructure policy checks
        run: |
          conftest test infra/cdktf.out/stacks/recipebox-infra/ -p policy/terraform.rego
      - name: Run ArgoCD policy checks
        run: |
          helm template recipebox k8s/ | conftest test -p policy/argocd.rego -
      - name: Run Helm chart tests
        run: |
          helm lint k8s/
  deploy-infra:
    needs: test-infra
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write # Required for Azure OIDC login if you use it later
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Download infrastructure artifact
        uses: actions/download-artifact@v4
        with:
          name: cdktf-out
          path: infra/cdktf.out/

      # REUSE THE ACTION (Much cleaner than wget)
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"
          terraform_wrapper: false

      # ALWAYS DEPLOY (Terraform handles the state logic)
      - name: Deploy infrastructure
        env:
          # Pass these if your backend needs them, otherwise Azure CLI login handles it
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          cd infra/cdktf.out/stacks/recipebox-infra
          # Initialize fresh (download providers again since artifacts don't keep .terraform folder)
          terraform init
          terraform apply -auto-approve
  build-and-deploy-app:
    needs: deploy-infra
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allows pushing changes to the repo
      id-token: write # Required for Azure login
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }} # Explicitly uses the permission above
      - name: Check changed files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files_yaml: |
            infra:
              - infra/**
            api:
              - api/**
            frontend:
              - frontend/**
            k8s:
              - k8s/**
            github:
              - .github/**
      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Run Backend tests
        run: |
          cd rust-backend
          cargo test
      - name: Setup Node.js for frontend
        uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Build and push Backend Docker image
        run: |
          az acr login --name recipeboxacr
          cd rust-backend
          docker build -t recipeboxacr.azurecr.io/recipebox-backend:${{ github.sha }} .
          docker push recipeboxacr.azurecr.io/recipebox-backend:${{ github.sha }}
      - name: Build and deploy Frontend to CDN
        if: steps.changed-files.outputs.frontend_any_changed == 'true'
        run: |
          cd frontend
          npm install
          npm run build --prod
          az storage blob upload-batch --account-name recipeboxstorage --destination '$web' --source dist/frontend --overwrite
          az cdn endpoint purge --resource-group rg-recipebox --profile-name recipebox-cdn --name recipebox-frontend --content-paths '/*'
      - name: Run Playwright tests
        if: steps.changed-files.outputs.frontend_any_changed == 'true'
        env:
          CI: true
        run: |
          cd frontend
          npx playwright install
          npm run start &
          sleep 10
          docker-compose -f ../../docker-compose.yml up -d rust-backend postgres
          sleep 30
          npx playwright test
          docker-compose -f ../../docker-compose.yml down
      - name: Update Helm values
        run: |
          sed -i "s|recipebox-backend:.*|recipebox-backend:${{ github.sha }}|" k8s/values.yaml
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # Pull latest changes to avoid "non-fast-forward" errors
          git pull --rebase origin main

          git add k8s/values.yaml

          # Add [skip ci] so this commit doesn't trigger the workflow again!
          git commit -m "Update image tag to ${{ github.sha }} [skip ci]" || echo "No changes to commit"

          git push origin HEAD:main
