name: Deploy to AKS

on:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  deploy-infra:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write # Required for Azure OIDC login if you use it later
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install Azure CLI
        run: |
          # Azure CLI is pre-installed on GitHub runners, but ensure it's up to date
          az upgrade --yes

      - name: Create Resource Group
        run: az group create --name rg-recipebox --location eastus --tags Environment=dev

      - name: Create Container Registry
        run: az acr create --name recipeboxacr --resource-group rg-recipebox --sku Basic --admin-enabled true --tags Environment=dev

      - name: Create Storage Account
        run: az storage account create --name recipeboxstorage --resource-group rg-recipebox --location eastus --sku Standard_LRS --allow-blob-public-access true --tags Environment=dev

      - name: Enable Static Website
        run: az storage blob service-properties update --account-name recipeboxstorage --static-website --index-document index.html --error-document-404-path index.html

      - name: Create PostgreSQL Flexible Server
        run: az postgres flexible-server create --name recipebox-pg --resource-group rg-recipebox --location eastus --admin-user pgadmin --admin-password ${{ secrets.POSTGRES_PASSWORD }} --sku-name Standard_B1ms --storage-size 32 --version 15 --zone 1 --tags Environment=dev

      - name: Create PostgreSQL Database
        run: az postgres flexible-server db create --server-name recipebox-pg --resource-group rg-recipebox --database-name recipebox

      - name: Create CDN Profile
        run: az cdn profile create --name recipebox-cdn --resource-group rg-recipebox --location eastus --sku Standard_Microsoft --tags Environment=dev

      - name: Create CDN Endpoint
        run: az cdn endpoint create --name recipebox-frontend --profile-name recipebox-cdn --resource-group rg-recipebox --location eastus --origin recipeboxstorage.z13.web.core.windows.net --origin-host-header recipeboxstorage.z13.web.core.windows.net --tags Environment=dev
  build-and-deploy-app:
    needs: deploy-infra
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allows pushing changes to the repo
      id-token: write # Required for Azure login
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }} # Explicitly uses the permission above
      - name: Check changed files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files_yaml: |
            infra:
              - infra/**
            api:
              - api/**
            frontend:
              - frontend/**
            k8s:
              - k8s/**
            github:
              - .github/**
      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Run Backend tests
        run: |
          cd rust-backend
          cargo test
      - name: Setup Node.js for frontend
        uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Build and push Backend Docker image
        run: |
          az acr login --name recipeboxacr
          cd rust-backend
          docker build -t recipeboxacr.azurecr.io/recipebox-backend:${{ github.sha }} .
          docker push recipeboxacr.azurecr.io/recipebox-backend:${{ github.sha }}
      - name: Build and deploy Frontend to CDN
        if: steps.changed-files.outputs.frontend_any_changed == 'true'
        run: |
          cd frontend
          npm install
          npm run build --prod
          az storage blob upload-batch --account-name recipeboxstorage --destination '$web' --source dist/frontend --overwrite
          az cdn endpoint purge --resource-group rg-recipebox --profile-name recipebox-cdn --name recipebox-frontend --content-paths '/*'
      - name: Run Playwright tests
        if: steps.changed-files.outputs.frontend_any_changed == 'true'
        env:
          CI: true
        run: |
          cd frontend
          npx playwright install
          npm run start &
          sleep 10
          docker-compose -f ../../docker-compose.yml up -d rust-backend postgres
          sleep 30
          npx playwright test
          docker-compose -f ../../docker-compose.yml down
      - name: Update Helm values
        run: |
          sed -i "s|recipebox-backend:.*|recipebox-backend:${{ github.sha }}|" k8s/values.yaml
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # Pull latest changes to avoid "non-fast-forward" errors
          git pull --rebase origin main

          git add k8s/values.yaml

          # Add [skip ci] so this commit doesn't trigger the workflow again!
          git commit -m "Update image tag to ${{ github.sha }} [skip ci]" || echo "No changes to commit"

          git push origin HEAD:main
