name: Deploy to AKS

on:
  push:
    branches:
      - main

jobs:
  build-infra:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Install CDKTF CLI
        run: npm install -g cdktf-cli
      - name: Install infrastructure dependencies
        run: |
          cd infra
          npm install --legacy-peer-deps
      - name: Set up swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 8
      - name: Synthesize infrastructure
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
        run: |
          cd infra
          cdktf synth
      - name: Upload infrastructure artifact
        uses: actions/upload-artifact@v4
        with:
          name: cdktf-out
          path: infra/cdktf.out/
  test-infra:
    needs: build-infra
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Download infrastructure artifact
        uses: actions/download-artifact@v4
        with:
          name: cdktf-out
          path: infra/cdktf.out/
      - name: Install Conftest
        run: |
          wget -O conftest.tar.gz https://github.com/open-policy-agent/conftest/releases/download/v0.48.0/conftest_0.48.0_Linux_x86_64.tar.gz
          tar -xzf conftest.tar.gz
          sudo mv conftest /usr/local/bin/
      - name: Run infrastructure policy checks
        run: |
          conftest test infra/cdktf.out/stacks/recipebox-infra/cdk.tf.json -p policy/terraform.rego
      - name: Run ArgoCD policy checks
        run: |
          conftest test k8s/ -p policy/argocd.rego
      - name: Run Helm chart tests
        run: |
          helm lint k8s/
  deploy-infra:
    needs: test-infra
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Check if infrastructure exists
        id: check-infra
        run: |
          if az acr show --name recipeboxacr --resource-group rg-recipebox --query "name" -o tsv 2>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - name: Download infrastructure artifact
        uses: actions/download-artifact@v4
        with:
          name: cdktf-out
          path: infra/cdktf.out/
      - name: Install Terraform
        run: |
          wget -O terraform.zip https://releases.hashicorp.com/terraform/1.6.6/terraform_1.6.6_linux_amd64.zip
          unzip terraform.zip
          sudo mv terraform /usr/local/bin/
      - name: Deploy infrastructure
        if: steps.check-infra.outputs.exists == 'false'
        env:
          GITHUB_REPOSITORY_URL: https://github.com/${{ github.repository }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          cd infra/cdktf.out/stacks/recipebox-infra
          terraform init
          terraform apply -auto-approve
  build-and-deploy-app:
    needs: deploy-infra
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check changed files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files_yaml: |
            infra:
              - infra/**
            api:
              - api/**
            frontend:
              - frontend/**
            k8s:
              - k8s/**
            github:
              - .github/**
      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Run API tests
        run: |
          cd api
          dotnet test --verbosity normal
      - name: Setup Node.js for frontend
        uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Build and push API Docker image
        run: |
          az acr login --name recipeboxacr
          cd api
          docker build -t recipeboxacr.azurecr.io/recipebox-api:${{ github.sha }} .
          docker push recipeboxacr.azurecr.io/recipebox-api:${{ github.sha }}
      - name: Build and deploy Frontend to CDN
        if: steps.changed-files.outputs.frontend_any_changed == 'true'
        run: |
          cd frontend
          npm install
          npm run build --prod
          az storage blob upload-batch --account-name recipeboxstorage --destination '$web' --source dist/frontend --overwrite
          az cdn endpoint purge --resource-group rg-recipebox --profile-name recipebox-cdn --name recipebox-frontend --content-paths '/*'
      - name: Run Playwright tests
        if: steps.changed-files.outputs.frontend_any_changed == 'true'
        env:
          CI: true
        run: |
          cd frontend
          npx playwright install
          npm run start &
          sleep 10
          docker-compose -f ../../docker-compose.yml up -d api postgres
          sleep 30
          npx playwright test
          docker-compose -f ../../docker-compose.yml down
      - name: Update Helm values
        run: |
          sed -i "s|recipebox-api:.*|recipebox-api:${{ github.sha }}|" k8s/values.yaml
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add k8s/values.yaml
          git commit -m "Update image tag to ${{ github.sha }}" || echo "No changes to commit"
          git push
