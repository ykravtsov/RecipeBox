name: Deploy to AKS

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to (dev/staging/prod)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  contents: read
  actions: read
  id-token: write

# REQUIRED GITHUB SECRETS (set in repository Settings → Secrets):
# - AZURE_CREDENTIALS: JSON with subscriptionId, tenantId, clientId, clientSecret
#   Get from: az ad sp create-for-rbac --role Contributor
# - POSTGRES_PASSWORD: Strong password (min 8 chars, uppercase, lowercase, number, special char)
# - GITHUB_REPOSITORY_URL: Full repository URL (https://github.com/your-org/recipebox)

jobs:
  deploy-infra:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      storage_account_name: ${{ steps.infra_deploy.outputs.storage_account_name }}
      acr_login_server: ${{ steps.infra_deploy.outputs.acr_login_server }}
      acr_name: ${{ steps.infra_deploy.outputs.acr_name }}
      resource_group_name: ${{ steps.infra_deploy.outputs.resource_group_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install CDKTF and dependencies
        run: |
          cd infra
          npm install

      - name: Build CDKTF
        run: |
          cd infra
          npm run build

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy infrastructure with CDKTF
        id: infra_deploy
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          GITHUB_REPOSITORY_URL: ${{ secrets.GITHUB_REPOSITORY_URL || format('{0}/{1}', github.server_url, github.repository) }}
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          cd infra
          npx cdktf deploy --auto-approve recipebox-infra


  build-and-deploy-app:
    needs: deploy-infra
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allows pushing changes to the repo
      id-token: write # Required for Azure login
    env:
      STORAGE_ACCOUNT_NAME: ${{ needs.deploy-infra.outputs.storage_account_name }}
      ACR_LOGIN_SERVER: ${{ needs.deploy-infra.outputs.acr_login_server }}
      ACR_NAME: ${{ needs.deploy-infra.outputs.acr_name }}
      RESOURCE_GROUP: ${{ needs.deploy-infra.outputs.resource_group_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }} # Explicitly uses the permission above
      - name: Check changed files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files_yaml: |
            infra:
              - infra/**
            api:
              - api/**
            frontend:
              - frontend/**
            k8s:
              - k8s/**
            github:
              - .github/**
      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Run Backend tests
        run: |
          cd rust-backend
          cargo test
      - name: Setup Node.js for frontend
        uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Build and push Backend Docker image
        run: |
          az acr login --name ${{ env.ACR_NAME }}
          cd rust-backend
          docker build -t ${{ env.ACR_LOGIN_SERVER }}/recipebox-backend:${{ github.sha }} .
          docker push ${{ env.ACR_LOGIN_SERVER }}/recipebox-backend:${{ github.sha }}
      - name: Build and deploy Frontend to CDN
        if: steps.changed-files.outputs.frontend_any_changed == 'true'
        run: |
          cd frontend
          npm install
          npm run build --prod
          az storage blob upload-batch --account-name ${{ env.STORAGE_ACCOUNT_NAME }} --destination '$web' --source dist/frontend --overwrite
          az cdn endpoint purge --resource-group ${{ env.RESOURCE_GROUP }} --profile-name recipebox-cdn-${{ github.event.inputs.environment || 'dev' }} --name recipebox-frontend-${{ github.event.inputs.environment || 'dev' }} --content-paths '/*'
      - name: Run Playwright tests
        if: steps.changed-files.outputs.frontend_any_changed == 'true'
        env:
          CI: true
        run: |
          cd frontend
          npx playwright install
          npm run start &
          sleep 10
          docker-compose -f ../../docker-compose.yml up -d rust-backend postgres
          sleep 30
          npx playwright test
          docker-compose -f ../../docker-compose.yml down
      - name: Update Helm values
        run: |
          sed -i "s|recipebox-backend:.*|recipebox-backend:${{ github.sha }}|" k8s/values.yaml
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # Pull latest changes to avoid "non-fast-forward" errors
          git pull --rebase origin main

          git add k8s/values.yaml

          # Add [skip ci] so this commit doesn't trigger the workflow again!
          git commit -m "Update image tag to ${{ github.sha }} [skip ci]" || echo "No changes to commit"

          git push origin HEAD:main
