name: Build and Push Container Images

on:
  # Trigger on code changes
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'rust-backend/**'
      - 'docker-compose.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'rust-backend/**'
      - 'docker-compose.yml'
  # Manual trigger
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  contents: read
  id-token: write

# Prevent duplicate concurrent builds
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.changes.outputs.frontend }}
      backend: ${{ steps.changes.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/build.yml'
            backend:
              - 'rust-backend/**'
              - '.github/workflows/build.yml'

  build-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for Deploy Infrastructure if running
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking for in-progress Deploy Infrastructure runs on this commit..."
          DEPLOY_RUN_ID=$(gh run list \
            --workflow=deploy.yml \
            --commit "${{ github.sha }}" \
            --status=in_progress \
            --json databaseId \
            --jq '.[0].databaseId' 2>/dev/null || echo "")
          if [ -n "$DEPLOY_RUN_ID" ]; then
            echo "Deploy run $DEPLOY_RUN_ID is in progress – waiting for it to complete..."
            gh run watch "$DEPLOY_RUN_ID" --exit-status || true
            echo "Deploy run finished."
          else
            echo "No in-progress deploy workflow found, proceeding."
          fi

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('rust-backend/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v3
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('rust-backend/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v3
        with:
          path: rust-backend/target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('rust-backend/Cargo.lock') }}

      - name: Build Rust project
        working-directory: rust-backend
        run: cargo build --release

      - name: Run Rust tests
        working-directory: rust-backend
        run: cargo test --release

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Determine environment and image tag
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENV="${{ github.event.inputs.environment }}"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            ENV="dev"
          else
            ENV="dev"
          fi
          
          TAG="latest"
          if [[ "${{ github.ref }}" == "refs/tags/v"* ]]; then
            TAG="${{ github.ref_name }}"
          elif [[ "${{ github.ref }}" != "refs/heads/main" ]]; then
            TAG="pr-${{ github.event.pull_request.number }}"
          fi
          
          echo "environment=$ENV" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Azure Login
        if: github.event_name != 'pull_request'
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up kubectl
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: azure/setup-kubectl@v3

      - name: Set up ArgoCD CLI
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          curl -sSL -o /usr/local/bin/argocd \
            https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x /usr/local/bin/argocd

      - name: Get ACR token (backend)
        if: github.event_name != 'pull_request'
        id: acr
        run: |
          REGISTRY="recipeboxacr${{ steps.meta.outputs.environment }}.azurecr.io"
          ACR_NAME="recipeboxacr${{ steps.meta.outputs.environment }}"
          
          # Get access token from ACR
          TOKEN=$(az acr login --name "$ACR_NAME" --expose-token --output tsv --query accessToken)
          
          echo "registry=$REGISTRY" >> $GITHUB_OUTPUT
          echo "username=00000000-0000-0000-0000-000000000000" >> $GITHUB_OUTPUT
          echo "password=$TOKEN" >> $GITHUB_OUTPUT

      - name: Login to ACR (backend)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.acr.outputs.registry }}
          username: ${{ steps.acr.outputs.username }}
          password: ${{ steps.acr.outputs.password }}

      - name: Build and push backend image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v4
        with:
          context: rust-backend
          file: rust-backend/Dockerfile
          push: true
          tags: |
            ${{ steps.acr.outputs.registry }}/recipebox-api:${{ steps.meta.outputs.tag }}
            ${{ steps.acr.outputs.registry }}/recipebox-api:latest

      - name: Deploy via ArgoCD sync
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GITHUB_PAT: ${{ secrets.ARGOCD_GITHUB_TOKEN }}
        run: |
          RG_NAME="rg-recipebox-${{ steps.meta.outputs.environment }}"
          AKS_NAME="recipebox-aks-${{ steps.meta.outputs.environment }}"
          az aks get-credentials --resource-group "$RG_NAME" --name "$AKS_NAME" --overwrite-existing

          ARGOCD_SERVER=$(kubectl get svc argocd-server -n argocd \
            -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          ARGOCD_PASSWORD=$(kubectl get secret argocd-initial-admin-secret \
            -n argocd -o jsonpath='{.data.password}' | base64 -d)

          argocd login "$ARGOCD_SERVER" \
            --username admin \
            --password "$ARGOCD_PASSWORD" \
            --insecure

          argocd repo add https://github.com/ykravtsov/RecipeBox \
            --username ykravtsov \
            --password "$GITHUB_PAT" \
            --upsert

          argocd app sync recipebox --force
          argocd app wait recipebox --timeout 180 || true
          echo "✓ ArgoCD sync triggered for backend update"

      - name: Build backend image (PR)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v4
        with:
          context: rust-backend
          file: rust-backend/Dockerfile
          push: false
          tags: recipebox-api:test

  build-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for Deploy Infrastructure if running
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking for in-progress Deploy Infrastructure runs on this commit..."
          DEPLOY_RUN_ID=$(gh run list \
            --workflow=deploy.yml \
            --commit "${{ github.sha }}" \
            --status=in_progress \
            --json databaseId \
            --jq '.[0].databaseId' 2>/dev/null || echo "")
          if [ -n "$DEPLOY_RUN_ID" ]; then
            echo "Deploy run $DEPLOY_RUN_ID is in progress – waiting for it to complete..."
            gh run watch "$DEPLOY_RUN_ID" --exit-status || true
            echo "Deploy run finished."
          else
            echo "No in-progress deploy workflow found, proceeding."
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build Angular app
        working-directory: frontend
        run: npm run build

      - name: Run frontend tests
        working-directory: frontend
        continue-on-error: true
        run: ng test --watch=false --browsers=ChromeHeadless 2>&1 || echo "Frontend tests skipped or failed (non-blocking)"

      - name: Build static site with Scully
        working-directory: frontend
        continue-on-error: true
        run: npm run scully --allowLocalUrls 2>/dev/null || echo "Scully build optional"

      - name: Determine environment and image tag
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENV="${{ github.event.inputs.environment }}"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            ENV="dev"
          else
            ENV="dev"
          fi
          
          TAG="latest"
          if [[ "${{ github.ref }}" == "refs/tags/v"* ]]; then
            TAG="${{ github.ref_name }}"
          elif [[ "${{ github.ref }}" != "refs/heads/main" ]]; then
            TAG="pr-${{ github.event.pull_request.number }}"
          fi
          
          echo "environment=$ENV" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Azure Login
        if: github.event_name != 'pull_request'
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up kubectl
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: azure/setup-kubectl@v3

      - name: Set up ArgoCD CLI
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          curl -sSL -o /usr/local/bin/argocd \
            https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x /usr/local/bin/argocd

      - name: Get ACR token (frontend)
        if: github.event_name != 'pull_request'
        id: acr
        run: |
          REGISTRY="recipeboxacr${{ steps.meta.outputs.environment }}.azurecr.io"
          ACR_NAME="recipeboxacr${{ steps.meta.outputs.environment }}"
          
          # Get access token from ACR
          TOKEN=$(az acr login --name "$ACR_NAME" --expose-token --output tsv --query accessToken)
          
          echo "registry=$REGISTRY" >> $GITHUB_OUTPUT
          echo "username=00000000-0000-0000-0000-000000000000" >> $GITHUB_OUTPUT
          echo "password=$TOKEN" >> $GITHUB_OUTPUT

      - name: Login to ACR (frontend)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.acr.outputs.registry }}
          username: ${{ steps.acr.outputs.username }}
          password: ${{ steps.acr.outputs.password }}

      - name: Build and push frontend image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v4
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.acr.outputs.registry }}/recipebox-frontend:${{ steps.meta.outputs.tag }}
            ${{ steps.acr.outputs.registry }}/recipebox-frontend:latest

      - name: Deploy via ArgoCD sync
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GITHUB_PAT: ${{ secrets.ARGOCD_GITHUB_TOKEN }}
        run: |
          RG_NAME="rg-recipebox-${{ steps.meta.outputs.environment }}"
          AKS_NAME="recipebox-aks-${{ steps.meta.outputs.environment }}"
          az aks get-credentials --resource-group "$RG_NAME" --name "$AKS_NAME" --overwrite-existing

          ARGOCD_SERVER=$(kubectl get svc argocd-server -n argocd \
            -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          ARGOCD_PASSWORD=$(kubectl get secret argocd-initial-admin-secret \
            -n argocd -o jsonpath='{.data.password}' | base64 -d)

          argocd login "$ARGOCD_SERVER" \
            --username admin \
            --password "$ARGOCD_PASSWORD" \
            --insecure

          # Ensure GitHub credentials are registered (idempotent)
          argocd repo add https://github.com/ykravtsov/RecipeBox \
            --username ykravtsov \
            --password "$GITHUB_PAT" \
            --upsert

          # Force sync so ArgoCD pulls the latest image
          argocd app sync recipebox --force
          argocd app wait recipebox --timeout 180 || true
          echo "✓ ArgoCD sync triggered for frontend update"

      - name: Build frontend image (PR)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v4
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          tags: recipebox-frontend:test

  test-e2e:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: success()
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: pgadmin
          POSTGRES_PASSWORD: testpass123
          POSTGRES_DB: recipebox
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'e2e/package-lock.json'

      - name: Install dependencies
        working-directory: e2e
        run: npm install

      - name: Run Cucumber E2E tests
        working-directory: e2e
        env:
          API_URL: http://localhost:3000
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: pgadmin
          DB_PASSWORD: testpass123
          DB_NAME: recipebox
        run: npm run test || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: e2e/test-results/
          if-no-files-found: warn

      - name: E2E test summary
        if: always()
        run: |
          echo "## E2E Test Results" >> $GITHUB_STEP_SUMMARY
          echo "- Test framework: Cucumber + Playwright" >> $GITHUB_STEP_SUMMARY
          echo "- Location: `e2e/`" >> $GITHUB_STEP_SUMMARY
          echo "- Status: Check logs for details" >> $GITHUB_STEP_SUMMARY

  notify:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, test-e2e]
    if: always()
    steps:
      - name: Build & Test Status Summary
        run: |
          echo "## Build & Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Backend Build" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ needs.build-backend.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Includes: Rust tests + Docker image build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Frontend Build" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ needs.build-frontend.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Includes: Angular tests + Docker image build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### E2E Tests" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ needs.test-e2e.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Framework: Cucumber + Playwright" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          RESULT="success"
          if [[ "${{ needs.build-backend.result }}" != "success" ]]; then RESULT="failure"; fi
          if [[ "${{ needs.build-frontend.result }}" != "success" ]]; then RESULT="failure"; fi
          if [[ "${{ needs.test-e2e.result }}" == "failure" ]]; then RESULT="failure"; fi
          
          echo "### Overall Result: $RESULT" >> $GITHUB_STEP_SUMMARY

