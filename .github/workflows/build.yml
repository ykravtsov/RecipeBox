name: Build and Push Container Images

on:
  # Trigger on code changes
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'rust-backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/build.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'rust-backend/**'
      - 'docker-compose.yml'
  # Wait for infrastructure deployment to complete first (prevents race conditions)
  workflow_run:
    workflows: ['Deploy Infrastructure']
    types: ['completed']
    branches: [main]
  # Manual trigger
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  contents: read
  id-token: write

# Prevent duplicate concurrent builds
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.changes.outputs.frontend }}
      backend: ${{ steps.changes.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/build.yml'
            backend:
              - 'rust-backend/**'
              - '.github/workflows/build.yml'

  build-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('rust-backend/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v3
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('rust-backend/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v3
        with:
          path: rust-backend/target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('rust-backend/Cargo.lock') }}

      - name: Build Rust project
        working-directory: rust-backend
        run: cargo build --release

      - name: Run Rust tests
        working-directory: rust-backend
        run: cargo test --release

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Determine environment and image tag
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENV="${{ github.event.inputs.environment }}"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            ENV="dev"
          else
            ENV="dev"
          fi
          
          TAG="latest"
          if [[ "${{ github.ref }}" == "refs/tags/v"* ]]; then
            TAG="${{ github.ref_name }}"
          elif [[ "${{ github.ref }}" != "refs/heads/main" ]]; then
            TAG="pr-${{ github.event.pull_request.number }}"
          fi
          
          echo "environment=$ENV" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Azure Login
        if: github.event_name != 'pull_request'
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get ACR login credentials
        if: github.event_name != 'pull_request'
        id: acr
        run: |
          REGISTRY="recipeboxacr${{ steps.meta.outputs.environment }}.azurecr.io"
          USERNAME=$(az acr credential show \
            --name recipeboxacr${{ steps.meta.outputs.environment }} \
            --resource-group "rg-recipebox-${{ steps.meta.outputs.environment }}" \
            --query "username" -o tsv 2>/dev/null || echo "")
          PASSWORD=$(az acr credential show \
            --name recipeboxacr${{ steps.meta.outputs.environment }} \
            --resource-group "rg-recipebox-${{ steps.meta.outputs.environment }}" \
            --query "passwords[0].value" -o tsv 2>/dev/null || echo "")
          
          echo "registry=$REGISTRY" >> $GITHUB_OUTPUT
          echo "username=$USERNAME" >> $GITHUB_OUTPUT
          echo "password=$PASSWORD" >> $GITHUB_OUTPUT

      - name: Build and push backend image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v4
        with:
          context: rust-backend
          file: rust-backend/Dockerfile
          push: true
          registry: ${{ steps.acr.outputs.registry }}
          username: ${{ steps.acr.outputs.username }}
          password: ${{ steps.acr.outputs.password }}
          tags: |
            ${{ steps.acr.outputs.registry }}/recipebox-api:${{ steps.meta.outputs.tag }}
            ${{ steps.acr.outputs.registry }}/recipebox-api:latest

      - name: Build backend image (PR)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v4
        with:
          context: rust-backend
          file: rust-backend/Dockerfile
          push: false
          tags: recipebox-api:test

  build-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build Angular app
        working-directory: frontend
        run: npm run build

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test:ci --watch=false

      - name: Build static site with Scully
        working-directory: frontend
        run: npm run scully --allowLocalUrls 2>/dev/null || echo "Scully build optional"

      - name: Determine environment and image tag
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENV="${{ github.event.inputs.environment }}"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            ENV="dev"
          else
            ENV="dev"
          fi
          
          TAG="latest"
          if [[ "${{ github.ref }}" == "refs/tags/v"* ]]; then
            TAG="${{ github.ref_name }}"
          elif [[ "${{ github.ref }}" != "refs/heads/main" ]]; then
            TAG="pr-${{ github.event.pull_request.number }}"
          fi
          
          echo "environment=$ENV" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Azure Login
        if: github.event_name != 'pull_request'
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get ACR login credentials
        if: github.event_name != 'pull_request'
        id: acr
        run: |
          REGISTRY="recipeboxacr${{ steps.meta.outputs.environment }}.azurecr.io"
          USERNAME=$(az acr credential show \
            --name recipeboxacr${{ steps.meta.outputs.environment }} \
            --resource-group "rg-recipebox-${{ steps.meta.outputs.environment }}" \
            --query "username" -o tsv 2>/dev/null || echo "")
          PASSWORD=$(az acr credential show \
            --name recipeboxacr${{ steps.meta.outputs.environment }} \
            --resource-group "rg-recipebox-${{ steps.meta.outputs.environment }}" \
            --query "passwords[0].value" -o tsv 2>/dev/null || echo "")
          
          echo "registry=$REGISTRY" >> $GITHUB_OUTPUT
          echo "username=$USERNAME" >> $GITHUB_OUTPUT
          echo "password=$PASSWORD" >> $GITHUB_OUTPUT

      - name: Build and push frontend image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v4
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          registry: ${{ steps.acr.outputs.registry }}
          username: ${{ steps.acr.outputs.username }}
          password: ${{ steps.acr.outputs.password }}
          tags: |
            ${{ steps.acr.outputs.registry }}/recipebox-frontend:${{ steps.meta.outputs.tag }}
            ${{ steps.acr.outputs.registry }}/recipebox-frontend:latest

      - name: Build frontend image (PR)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v4
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          tags: recipebox-frontend:test

  test-e2e:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: success()
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: pgadmin
          POSTGRES_PASSWORD: testpass123
          POSTGRES_DB: recipebox
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'e2e/package-lock.json'

      - name: Install dependencies
        working-directory: e2e
        run: npm install

      - name: Run Cucumber E2E tests
        working-directory: e2e
        env:
          API_URL: http://localhost:3000
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: pgadmin
          DB_PASSWORD: testpass123
          DB_NAME: recipebox
        run: npm run test || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: e2e/test-results/
          if-no-files-found: warn

      - name: E2E test summary
        if: always()
        run: |
          echo "## E2E Test Results" >> $GITHUB_STEP_SUMMARY
          echo "- Test framework: Cucumber + Playwright" >> $GITHUB_STEP_SUMMARY
          echo "- Location: `e2e/`" >> $GITHUB_STEP_SUMMARY
          echo "- Status: Check logs for details" >> $GITHUB_STEP_SUMMARY

  notify:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, test-e2e]
    if: always()
    steps:
      - name: Build & Test Status Summary
        run: |
          echo "## Build & Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Backend Build" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ needs.build-backend.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Includes: Rust tests + Docker image build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Frontend Build" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ needs.build-frontend.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Includes: Angular tests + Docker image build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### E2E Tests" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ needs.test-e2e.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Framework: Cucumber + Playwright" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          RESULT="success"
          if [[ "${{ needs.build-backend.result }}" != "success" ]]; then RESULT="failure"; fi
          if [[ "${{ needs.build-frontend.result }}" != "success" ]]; then RESULT="failure"; fi
          if [[ "${{ needs.test-e2e.result }}" == "failure" ]]; then RESULT="failure"; fi
          
          echo "### Overall Result: $RESULT" >> $GITHUB_STEP_SUMMARY

