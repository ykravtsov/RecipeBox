name: Policy as Code Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  policy-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install CDKTF CLI
        run: npm install -g cdktf-cli

      - name: Install Conftest
        run: |
          wget -O conftest.tar.gz https://github.com/open-policy-agent/conftest/releases/download/v0.48.0/conftest_0.48.0_Linux_x86_64.tar.gz
          tar -xzf conftest.tar.gz
          sudo mv conftest /usr/local/bin/

      - name: Install infrastructure dependencies
        run: |
          cd infra
          npm install

      - name: Run Policy as Code tests
        run: ./test-all.sh
