backend:
  image:
    repository: recipeboxacrdev.azurecr.io/recipebox-api
    tag: "latest"
    pullPolicy: Always
  replicaCount: 1
  service:
    type: ClusterIP
    port: 80
    targetPort: 3000
  database:
    url: "postgres://pgadmin:Postgre$123!@recipebox-pg-dev.postgres.database.azure.com/recipebox?sslmode=require"
  jwt:
    secret: "development-jwt-secret-key-for-testing-only"
  xai:
    apiKey: "dummy-key-for-development"
  resources: {}
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi

frontend:
  image:
    repository: recipeboxacrdev.azurecr.io/recipebox-frontend
    tag: "latest"
    pullPolicy: Always
  replicaCount: 1
  service:
    type: ClusterIP
    port: 80
    targetPort: 80
  resources: {}
