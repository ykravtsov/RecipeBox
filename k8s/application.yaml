apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: recipebox
  namespace: argocd
spec:
  description: RecipeBox Application Project
  sourceRepos:
  - 'https://github.com/ykravtsov/RecipeBox'
  destinations:
  - namespace: 'default'
    server: https://kubernetes.default.svc
  clusterResourceWhitelist:
  - group: '*'
    kind: '*'
  namespaceResourceWhitelist:
  - group: '*'
    kind: '*'
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: recipebox
  namespace: argocd
spec:
  project: recipebox
  source:
    repoURL: https://github.com/ykravtsov/RecipeBox
    targetRevision: HEAD
    path: k8s/
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
