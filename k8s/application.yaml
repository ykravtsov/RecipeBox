apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: recipebox
  namespace: argocd
spec:
  project: recipebox
  source:
    repoURL: https://github.com/ykravtsov/RecipeBox
    targetRevision: HEAD
    path: k8s/
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
