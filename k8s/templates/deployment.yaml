apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "recipebox.fullname" . }}-api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "recipebox.name" . }}-api
  template:
    metadata:
      labels:
        app: {{ include "recipebox.name" . }}-api
    spec:
      containers:
      - name: api
        image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
        imagePullPolicy: {{ .Values.api.image.pullPolicy }}
        ports:
        - containerPort: 8080
        env:
        - name: ConnectionStrings__DefaultConnection
          value: "Host=recipebox-pg.postgres.database.azure.com;Database=recipebox;Username=pgadmin;Password=P@ssw0rd123!;SSL Mode=Require;Trust Server Certificate=true"
        resources:
          {{- toYaml .Values.api.resources | nindent 12 }}
