apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "recipebox.fullname" . }}-backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "recipebox.name" . }}-backend
  template:
    metadata:
      labels:
        app: {{ include "recipebox.name" . }}-backend
    spec:
      containers:
      - name: backend
        image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
        imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
        ports:
        - containerPort: 3000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: {{ include "recipebox.fullname" . }}-backend-secret
              key: DATABASE_URL
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ include "recipebox.fullname" . }}-backend-secret
              key: JWT_SECRET
        - name: XAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "recipebox.fullname" . }}-backend-secret
              key: XAI_API_KEY
        resources:
          {{- toYaml .Values.backend.resources | nindent 12 }}
