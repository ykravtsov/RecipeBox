apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "recipebox.fullname" . }}
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - recipebox.food
    secretName: recipebox-tls
  rules:
  - host: recipebox.food
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: {{ include "recipebox.fullname" . }}-backend
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ include "recipebox.fullname" . }}-frontend
            port:
              number: 80
