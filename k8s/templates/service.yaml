apiVersion: v1
kind: Service
metadata:
  name: {{ include "recipebox.fullname" . }}-api
spec:
  type: {{ .Values.api.service.type }}
  ports:
  - port: {{ .Values.api.service.port }}
    targetPort: {{ .Values.api.service.targetPort }}
    protocol: TCP
  selector:
    app: {{ include "recipebox.name" . }}-api
